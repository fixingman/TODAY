<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
  <style>
    @font-face { font-family: "Syne"; font-weight: 700; src: url("assets/fonts/syne-700.woff2") format("woff2"); }
    @font-face { font-family: "DM Mono"; font-weight: 400; src: url("assets/fonts/dm-mono-400.woff2") format("woff2"); }
    #f02 { position: absolute; inset: 0; background: #0e0e10; container-type: size; overflow: hidden; }
    /* The spine: the real app, cropped to its column, one portrait window left. */
    #f02 .window { position: absolute; top: 6cqw; left: 7cqw; height: calc(100cqh - 12cqw); aspect-ratio: 4 / 5; border: 1px solid #2a2a30; overflow: hidden; background: #0e0e10; }
    #f02 .window video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #f02 .caption { position: absolute; left: 50cqw; right: 7cqw; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
    #f02 .kicker { font-family: "DM Mono"; font-size: 0.95cqw; letter-spacing: 0.3em; text-transform: uppercase; color: #80808d; margin-bottom: 2cqw; }
    #f02 .display { font-family: "Syne"; font-weight: 700; font-size: 4.2cqw; line-height: 1.04; letter-spacing: -0.01em; color: #e8e8ec; margin-bottom: 0.6cqw; }
    #f02 .accent { color: #c8f060; }
  </style>

  <div data-hf-id="hf-hxtb" id="f02" data-composition-id="f02" data-width="1920" data-height="1080">
    <div data-hf-id="hf-io6r" class="window" id="f02-window">
      <video data-hf-id="hf-uv1k" id="f02-add" class="clip" src="assets/add.mp4" data-start="0.2" data-duration="3.667" data-track-index="0" muted playsinline></video>
      <video data-hf-id="hf-wscv" id="f02-complete" class="clip" src="assets/complete.mp4" data-start="3.867" data-duration="4.133" data-track-index="1" muted playsinline></video>
    </div>
    <div data-hf-id="hf-gsc6" class="caption" data-layout-allow-overlap>
      <div data-hf-id="hf-np57" class="kicker" id="f02-k">Monday morning</div>
      <div data-hf-id="hf-jrdx" class="display" id="f02-c1">One day.</div>
      <div data-hf-id="hf-dt9o" class="display" id="f02-c2">One list.</div>
      <div data-hf-id="hf-2qyk" class="display accent" id="f02-c3">It ends.</div>
    </div>
  </div>

  <script>
    (function () {
      const ease = "expo.out";
      const rise = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease }, at);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-window", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease }, 0.05);
      rise("#f02-k", 0.3);
      rise("#f02-c1", 0.5);
      rise("#f02-c2", 1.7);
      rise("#f02-c3", 4.1); // lands on the first check-off
      window.__timelines["f02"] = tl;
    })();
  </script>
