<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>TODAY — Explore clarity study</title>
<link rel="stylesheet" href="../baseline.css"><link rel="stylesheet" href="native.css"><link rel="stylesheet" href="before.css"><link rel="stylesheet" href="study.css">
<script src="baseline.js" defer></script><script src="study.js" defer></script>
</head>
<body>
<aside class="study-tools" aria-label="Design study controls"><p>Design study · fictional · nothing saved<br><span>Load example for scripted replies. No AI runs here.</span></p><div class="study-actions"><button class="btn-ghost" data-action="before" aria-pressed="false">Before</button><button class="btn-ghost" data-action="proposal" aria-pressed="true">Proposal</button><button class="btn-ghost" data-action="example">Load example</button><button class="btn-ghost" data-action="reset">Start empty</button></div><p id="studyStatus" class="visually-hidden" role="status"></p></aside>
<header class="sticky-header"><div class="sticky-header-inner"><div class="header"><h1 class="today-brand"><button class="today-logo active" data-action="open" aria-label="TODAY — Explore">TO<span>DAY</span></button></h1><span class="date-label">a fictional day</span></div></div></header>
<main class="app"><section class="config-panel open" id="studyPanel" aria-labelledby="sheetTitle"><div class="config-title-row"><h2 class="config-title" id="sheetTitle">✦︎ Explore</h2><button class="btn-ghost" id="back" data-action="back">back to Today</button></div><div id="clarityView"></div></section><button class="entry" data-action="open">✦︎ Explore</button><section class="task-preview" aria-labelledby="taskTitle"><h2 class="section-label" id="taskTitle">Your tasks</h2><ul id="taskList"><li>Email pottery studio about times</li></ul></section></main>
<div class="add-task-row" id="addTaskBar"><label class="visually-hidden" for="capture">New task</label><input class="add-task-input" id="capture" placeholder="What's on your mind?" maxlength="500" enterkeyhint="done"><span class="capture-label">add a task</span></div>
</body></html>
