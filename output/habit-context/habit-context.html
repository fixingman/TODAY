 }
}
function render(){renderHabits();renderScene()}
function finishEdit(){S.habits.forEach(function(h){h.name=h.name.trim().slice(0,100)||h.previous;h.previous=h.name});S.edit=false}
function save(){
 if(!window.openai||typeof window.openai.setWidgetState!=='function')return;
 var snapshot={modelContent:{prototype:'habit-context-v2',scene:S.scene,width:S.width},privateContent:{habits:S.habits.map(function(h){return{id:h.id,name:h.name,done:h.done}})}};
 lastSaved=JSON.stringify(snapshot);try{Promise.resolve(window.openai.setWidgetState(snapshot)).catch(function(){})}catch(_){}
}
function load(snapshot){
 if(!snapshot||snapshot.modelContent?.prototype!=='habit-context-v2'||JSON.stringify(snapshot)===lastSaved)return false;
 var model=snapshot.modelContent;if(['habits','morning','ordinary'].includes(model.scene))S.scene=model.scene;if(['phone','responsive'].includes(model.width))S.width=model.width;
 if(Array.isArray(snapshot.privateContent?.habits)){
  var ids=new Set();S.habits=snapshot.privateContent.habits.slice(0,12).filter(function(h){return h&&typeof h.name==='string'&&h.name.trim()&&typeof h.id==='string'&&/^(read|charge|walk|n\d{1,6})$/.test(h.id)&&!ids.has(h.id)&&ids.add(h.id)}).map(function(h){var n=/^n(\d+)$/.exec(h.id);if(n)S.seq=Math.max(S.seq,Number(n[1]));return mk(h.id,h.name.trim().slice(0,100),h.done===true)});
 }
 S.edit=false;S.adding=false;S.focused=null;S.asked=false;S.undo=null;return true;
}
function add(){
 var input=q('.habit-input'),name=input.value.trim().slice(0,100);if(!name){input.focus();return}
 if(S.habits.length>=12){status.textContent='This study holds twelve example habits.';return}
 S.habits.push(mk('n'+(++S.seq),name,false));input.value='';renderHabits();input.focus({preventScroll:true});save();
}
R.addEventListener('click',function(event){
 var b=event.target.closest('[data-act]');if(!b||!R.contains(b))return;
 var action=b.dataset.act,parent=b.closest('.habit'),id=parent&&parent.dataset.id,h=id&&find(id);
 if(action==='scene'){finishEdit();S.scene=b.dataset.v;S.focused=null;S.asked=false;S.adding=false;S.undo=null;render();save()}
 else if(action==='width'){S.width=b.dataset.v;renderScene();save()}
 else if(action==='new'){if(S.edit){finishEdit();save()}S.adding=!S.adding;renderHabits();fx(S.adding?'.habit-input':'[data-act=new]')}
 else if(action==='add')add();
 else if(action==='edit'){if(S.edit){finishEdit();save()}else{S.edit=true;S.adding=false}renderHabits();fx('[data-act=edit]')}
 else if(action==='check'&&h){
  h.done=!h.done;status.textContent=h.name+(h.done?' done.':' marked incomplete.');
  if(S.focused&&h.done){S.focused=null;S.asked=false;render();fx('.habit-list .habit[data-id="'+h.id+'"] .habit-check')}
  else{parent.classList.toggle('done-today',h.done);b.textContent=h.done?'✓':'';b.setAttribute('aria-pressed',String(h.done));b.setAttribute('aria-label',(h.done?'Mark incomplete: ':'Mark complete: ')+h.name);parent.querySelector('.week-dot:last-child').classList.toggle('filled',h.done)}
  save();
 }
 else if(action==='focus'&&h&&focusSupported()){S.focused=h.id;S.asked=false;renderScene();fx('[data-act=star]')}
 else if(action==='star'){S.asked=!S.asked;renderScene();fx('[data-act=star]')}
 else if(action==='rest'){var former=S.focused;S.focused=null;S.asked=false;renderScene();fx('.habit-list .habit[data-id="'+former+'"] .habit-name')}
 else if(action==='archive'&&h){S.undo={habit:{...h},index:S.habits.indexOf(h)};S.habits=S.habits.filter(function(item){return item!==h});if(!S.habits.length)S.edit=false;renderHabits();fx(S.edit?'[data-act=edit]':'[data-act=new]');save()}
 else if(action==='undo'&&S.undo){var restored=S.undo.habit;S.habits.splice(S.undo.index,0,restored);S.undo=null;renderHabits();fx(S.edit?'.habit[data-id="'+restored.id+'"] input':'.habit[data-id="'+restored.id+'"] .habit-name');save()}
 else if(action==='task'){var morning=T[S.scene],i=Number(b.dataset.index);if(morning){morning.done[i]=!morning.done[i];renderScene();fx('.thc-task:nth-child('+(i+1)+') .habit-check')}}
});
R.addEventListener('input',function(event){if(!event.target.classList.contains('habit-edit-input'))return;var h=find(event.target.closest('.habit').dataset.id);if(h)h.name=event.target.value});
R.addEventListener('keydown',function(event){
 if(event.isComposing)return;var target=event.target,parent=target.closest('.habit'),h=parent&&find(parent.dataset.id);
 if(event.key==='Enter'&&target.classList.contains('habit-input')){event.preventDefault();add()}
 else if(event.key==='Enter'&&target.classList.contains('habit-edit-input')){event.preventDefault();fx('[data-act=edit]')}
 else if(event.key===' '&&target.classList.contains('habit-name')&&h){event.preventDefault();parent.querySelector('.habit-check').click()}
 else if(event.altKey&&['ArrowUp','ArrowDown'].includes(event.key)&&h&&!S.focused){event.preventDefault();var from=S.habits.indexOf(h),to=from+(event.key==='ArrowUp'?-1:1);if(to>=0&&to<S.habits.length){S.habits.splice(from,1);S.habits.splice(to,0,h);renderHabits();fx('.habit[data-id="'+h.id+'"] '+(S.edit?'input':(focusSupported()?'.habit-name':'.habit-check')));save()}}
 else if(event.key==='Escape'&&S.focused){event.preventDefault();q('[data-act=rest]').click()}
 else if(event.key==='Escape'&&S.edit){event.preventDefault();finishEdit();renderHabits();fx('[data-act=edit]');save()}
});
window.addEventListener('openai:set_globals',function(event){var snapshot=event.detail?.globals?.widgetState;if(snapshot&&load(snapshot))render()});
load(window.openai?.widgetState);render();
if(globalThis.Tweak){var tweak=new Tweak({container:R,onChange:function(){S.width=design.width==='Phone'?'phone':'responsive';renderScene();save()}});tweak.addSelect(design,'width',{label:'Preview width',options:['Responsive','Phone']})}
})();
</script>
</div>
