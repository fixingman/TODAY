<!DOCTYPE html>
<html lang="en" style="background:#0e0e10;color-scheme:dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <title>Daily poem · TODAY</title>
  <meta property="og:site_name" content="TODAY">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Daily poem · TODAY">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://today-here.netlify.app/assets/today-og.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Daily poem · TODAY">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://today-here.netlify.app/assets/today-og.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'DM Mono';
      src: url('/fonts/DM%20Mono/dm-mono-v16-latin-regular.woff2') format('woff2');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'DM Mono';
      src: url('/fonts/DM%20Mono/dm-mono-v16-latin-300.woff2') format('woff2');
      font-weight: 300; font-display: swap;
    }

    html { height: 100%; background: #0e0e10; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      background: #0e0e10;
      color: #e0e0e0;
      font-family: 'DM Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }


    /* poem area */
    .poem-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 36px;
      width: 100%;
    }
    .poem-card {
      max-width: 440px;
      width: 100%;
    }
    .poem-text {
      font-size: 18px;
      font-weight: 300;
      line-height: 1.9;
      color: #d4d4d4;
      letter-spacing: 0.01em;
      margin-bottom: 24px;
      text-wrap: pretty;
    }
    .poem-author {
      font-size: 12px;
      color: #888;
      letter-spacing: 0.07em;
    }
    .poem-author::before { content: '— '; }

    /* footer */
    .page-footer {
      width: 100%;
      padding: 0 32px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    @keyframes ctaShimmer {
      from { background-position: 0% center; }
      to   { background-position: 100% center; }
    }
    .cta-link {
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.07em;
      background: linear-gradient(90deg,
        #c8f060 0%, #c8f060 47%,
        #fff    50%,
        #c8f060 53%, #c8f060 100%
      );
      background-size: 400% 100%;
      background-position: 0% center;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cta-link:hover {
      animation: ctaShimmer 450ms ease-in-out 1 normal both;
    }
    .embed-hint {
      font-size: 11px;
      color: #1e1e1e;
      letter-spacing: 0.03em;
      cursor: default;
    }

    /* share-as-image button */
    .share-img-btn {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 11px;
      color: #2e2e2e;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.07em;
      padding: 0;
      transition: color 0.15s;
    }
    .share-img-btn:hover { color: #555; }

    /* embed mode */
    body.embed-mode .poem-wrap      { padding: 28px 20px 20px; }
    body.embed-mode .page-footer    { padding: 0 20px 18px; }
    body.embed-mode .embed-hint     { display: none; }
    body.embed-mode .share-img-btn  { display: none; }

    /* error */
    .error-msg { color: #3a3a3a; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="poem-wrap">
    <div class="poem-card" id="poemCard">
      <p class="error-msg">Loading…</p>
    </div>
  </main>

  <footer class="page-footer">
    <a href="https://today-here.netlify.app" class="cta-link" target="_blank" rel="noopener">Open TODAY ↗</a>
    <button class="share-img-btn" id="shareImgBtn" onclick="_shareAsImage()" style="display:none">save as image</button>
  </footer>

  <script src="/assets/poems.js"></script>
  <script src="/assets/poem-utils.js"></script>
  <script>
    const params    = new URLSearchParams(location.search);
    const dateParam = params.get('date');
    const isEmbed   = params.get('embed') === '1';
    if (isEmbed) document.body.classList.add('embed-mode');

    function fmtDate(dateStr) {
      const d = dateStr ? new Date(dateStr + 'T12:00:00') : new Date();
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    const poem = _poemForDate(dateParam);
    const card = document.getElementById('poemCard');

    if (!poem) {
      card.innerHTML = '<p class="error-msg">No poem found for this date.</p>';
    } else {
      card.innerHTML = `
        <div class="poem-text">${_poemHTML(poem.text)}</div>
        <div class="poem-author">${_escPoem(poem.author)}</div>
      `.trim();

      const title = poem.author + ' · TODAY';
      const desc  = poem.text.replace(/\n/g, ' ') + ' — ' + poem.author;
      document.title = title;
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);

      document.getElementById('shareImgBtn').style.display = '';
    }

    function _wrapText(ctx, text, maxW) {
      const out = [];
      for (const raw of text.split('\n')) {
        const words = raw.split(' ');
        let cur = '';
        for (const w of words) {
          const test = cur ? cur + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = w; }
          else cur = test;
        }
        out.push(cur);
      }
      return out;
    }

    async function _shareAsImage() {
      if (!poem) return;
      await document.fonts.ready;

      const W = 1080, H = 1350;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // background
      ctx.fillStyle = '#0e0e10';
      ctx.fillRect(0, 0, W, H);

      // ✦ mark
      ctx.textAlign = 'center';
      ctx.fillStyle = '#c8f060';
      ctx.font = '400 52px "DM Mono","Courier New",monospace';
      ctx.fillText('❖', W / 2, 148);

      // TODAY brand
      ctx.fillStyle = '#242424';
      ctx.font = '400 18px "DM Mono","Courier New",monospace';
      ctx.fillText('T O D A Y', W / 2, 190);

      // poem text — centered block
      const PAD = 112, POEM_SIZE = 32, LINE_H = Math.round(POEM_SIZE * 1.9);
      const maxW = W - PAD * 2;
      ctx.font = '300 ' + POEM_SIZE + 'px "DM Mono","Courier New",monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#d4d4d4';

      const poemLines = _wrapText(ctx, poem.text, maxW);
      const totalH = poemLines.length * LINE_H;
      let py = Math.round((H - totalH) / 2) - 20;
      for (const line of poemLines) { ctx.fillText(line, PAD, py); py += LINE_H; }

      // author
      ctx.fillStyle = '#3a3a3a';
      ctx.font = '400 22px "DM Mono","Courier New",monospace';
      ctx.fillText('— ' + poem.author, PAD, py + 32);

      // date + URL (very dim, bottom)
      ctx.textAlign = 'center';
      ctx.fillStyle = '#1e1e1e';
      ctx.font = '400 16px "DM Mono","Courier New",monospace';
      ctx.fillText(fmtDate(dateParam), W / 2, H - 76);
      ctx.fillStyle = '#191919';
      ctx.font = '400 14px "DM Mono","Courier New",monospace';
      ctx.fillText('today-here.netlify.app', W / 2, H - 52);

      canvas.toBlob(async blob => {
        const file = new File([blob], 'poem.png', { type: 'image/png' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: poem.author + ' · TODAY' });
          } else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'poem.png';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
          }
        } catch (e) {
          if (e.name !== 'AbortError') console.warn('[poem] share failed', e);
        }
      }, 'image/png');
    }
  </script>
</body>
</html>
