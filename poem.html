<!DOCTYPE html>
<html lang="en" style="background:#0e0e10;color-scheme:dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <title>Daily poem · TODAY</title>
  <meta property="og:site_name" content="TODAY">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Daily poem · TODAY">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://today-here.netlify.app/assets/today-og.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Daily poem · TODAY">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://today-here.netlify.app/assets/today-og.png">
  <link rel="manifest" href="/manifest.json">
  <script>(function(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var ctx=c.getContext('2d'),cx=s/2,cy=s/2,r=s*0.38,lw=s*0.10;ctx.fillStyle='#0e0e10';ctx.fillRect(0,0,s,s);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#2a2a30';ctx.lineWidth=lw;ctx.stroke();ctx.fillStyle='#c8f060';ctx.font=(s*0.48)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',cx,cy+2);var l=document.createElement('link');l.rel='icon';l.type='image/png';l.href=c.toDataURL('image/png');document.head.appendChild(l);})();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'DM Mono';
      src: url('/fonts/DM%20Mono/dm-mono-v16-latin-regular.woff2') format('woff2');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'DM Mono';
      src: url('/fonts/DM%20Mono/dm-mono-v16-latin-300.woff2') format('woff2');
      font-weight: 300; font-display: swap;
    }
    @font-face {
      font-family: 'Syne';
      src: url('/fonts/syne/syne-v24-latin_latin-ext-800.woff2') format('woff2');
      font-weight: 800; font-display: swap;
    }

    html { height: 100%; background: #0e0e10; }
    .visually-hidden {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      background: #0e0e10;
      color: #e8e8ec;
      font-family: 'DM Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }


    /* poem area */
    .poem-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 36px;
      width: 100%;
    }
    .poem-card {
      max-width: 440px;
      width: 100%;
    }
    .poem-text {
      font-size: 18px;
      font-weight: 300;
      line-height: 1.9;
      color: #e8e8ec;
      letter-spacing: 0.01em;
      margin-bottom: 24px;
      text-wrap: pretty;
    }
    /* <cite> defaults to italic, but only upright DM Mono ships — keep it upright. */
    .poem-author {
      font-size: 12px;
      font-style: normal;
      color: #80808d;
      letter-spacing: 0.07em;
    }
    .poem-author::before { content: '— '; }

    /* footer */
    .page-footer {
      width: 100%;
      padding: 0 32px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    @keyframes ctaShimmer {
      from { background-position: 0% center; }
      to   { background-position: 100% center; }
    }
    /* Gradient encodes the full hover sequence in one left→right pass:
       pos 0%  → bright lime  (default)
       pos 25% → dark dip
       pos 50% → white peak   (shimmer)
       pos 75% → dark dip
       pos 100%→ bright lime  (settled while hovering) */
    .cta-link {
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 4px;
      letter-spacing: 0.07em;
      color: #c8f060;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .cta-link._shimmer {
      animation: ctaShimmer 700ms ease-out 1 normal forwards;
    }

    /* share-as-image button */
    .share-img-btn {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 11px;
      color: #80808d;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.07em;
      padding: 10px 4px;
      min-height: 44px;
      transition: color 0.15s;
    }
    .share-img-btn:hover { color: #c8f060; }
    :where(a, button):focus-visible { outline: 2px solid #c8f060; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .cta-link._shimmer { animation: none; } }

    /* embed mode */
    body.embed-mode .poem-wrap      { padding: 28px 20px 20px; }
    body.embed-mode .page-footer    { padding: 0 20px 18px; }
    body.embed-mode .share-img-btn  { display: none; }

    /* error */
    .error-msg { color: #80808d; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1 class="visually-hidden" id="poemHeading">Daily poem from TODAY</h1>
  <main class="poem-wrap" aria-labelledby="poemHeading">
    <article class="poem-card" id="poemCard" aria-live="polite">
      <p class="error-msg" role="status">Loading…</p>
    </article>
  </main>

  <footer class="page-footer">
    <a href="https://today-here.netlify.app" class="cta-link" target="_blank" rel="noopener">Open TODAY ↗</a>
    <button class="share-img-btn" id="shareImgBtn" onclick="_shareAsImage()" style="display:none">save as image</button>
  </footer>
  <div class="visually-hidden" id="shareStatus" role="status" aria-live="polite"></div>

  <script src="/assets/poems.js"></script>
  <script src="/assets/poem-utils.js"></script>
  <script>
    const params    = new URLSearchParams(location.search);
    const dateParam = params.get('date');
    const isEmbed   = params.get('embed') === '1';
    if (isEmbed) document.body.classList.add('embed-mode');

    function fmtDate(dateStr) {
      const d = dateStr ? new Date(dateStr + 'T12:00:00') : new Date();
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    const poem = _poemForDate(dateParam);
    const card = document.getElementById('poemCard');

    if (!poem) {
      card.innerHTML = '<p class="error-msg">No poem found for this date.</p>';
    } else {
      card.innerHTML = `
        <blockquote class="poem-text">${_poemHTML(poem.text)}</blockquote>
        <cite class="poem-author">${_escPoem(poem.author)}</cite>
      `.trim();

      const title = poem.author + ' · TODAY';
      const desc  = poem.text.replace(/\n/g, ' ') + ' — ' + poem.author;
      document.title = title;
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);

      document.getElementById('shareImgBtn').style.display = '';
    }

    // Share image (1080×1350). Up to three rendered lines: a centred poster; longer
    // poems: one left axis. A small lime star leads the poem, the TODAY wordmark signs
    // off at the foot. Type fits the longest line; wrapped lines are balanced and never
    // strand one word (the _poemHTML widow rule). Colours are the app tokens.
    const IMG = { W: 1080, H: 1350, M: 120, bg: '#0e0e10', text: '#e8e8ec', muted: '#80808d', accent: '#c8f060' };
    const MONO = '"DM Mono","Courier New",monospace';

    // Fewest segments that fit, balanced so the longest is as short as possible.
    function _wrapBalanced(ctx, line, maxW) {
      const words = line.split(' ');
      if (ctx.measureText(line).width <= maxW || words.length < 2) return [line];
      const fill = lim => {
        const segs = []; let c = '';
        for (const w of words) {
          const t = c ? c + ' ' + w : w;
          if (ctx.measureText(t).width > lim && c) { segs.push(c); c = w; } else c = t;
        }
        segs.push(c);
        return segs;
      };
      let best = fill(maxW);
      const n = best.length;
      for (let lim = Math.max(...best.map(g => ctx.measureText(g).width)) - 8; lim > maxW / 3; lim -= 8) {
        const segs = fill(lim);
        if (segs.length > n) break;
        best = segs;
      }
      const last = best[best.length - 1];
      if (best.length > 1 && !last.includes(' ')) {
        const prev = best[best.length - 2].split(' ');
        if (prev.length > 1) {
          best[best.length - 1] = prev.pop() + ' ' + last;
          best[best.length - 2] = prev.join(' ');
        }
      }
      return best;
    }

    function _layoutPoem(ctx, text, maxW) {
      const authored = text.split('\n');
      for (let size = 52; size >= 32; size--) {
        ctx.font = '400 ' + size + 'px ' + MONO;
        if (authored.every(l => ctx.measureText(l).width <= maxW)) {
          return { size, rows: authored.map(l => ({ text: l, cont: false, gap: l.trim() === '' })) };
        }
      }
      const size = 32;
      ctx.font = '400 ' + size + 'px ' + MONO;
      const indent = ctx.measureText('  ').width;
      const rows = [];
      for (const l of authored) {
        if (l.trim() === '') { rows.push({ text: '', cont: false, gap: true }); continue; }
        _wrapBalanced(ctx, l, maxW - indent).forEach((seg, i) => rows.push({ text: seg, cont: i > 0, indent }));
      }
      return { size, rows };
    }

    // Splash star path (40×40 viewBox).
    function _drawStar(ctx, cx, cy, px) {
      const sc = px / 40;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-20, -20);
      ctx.beginPath();
      ctx.moveTo(20, 2); ctx.lineTo(22.4, 17.6); ctx.lineTo(38, 20); ctx.lineTo(22.4, 22.4);
      ctx.lineTo(20, 38); ctx.lineTo(17.6, 22.4); ctx.lineTo(2, 20); ctx.lineTo(17.6, 17.6);
      ctx.closePath();
      ctx.fillStyle = IMG.accent;
      ctx.fill();
      ctx.restore();
    }

    // Syne 800 wordmark, TO in text and DAY in accent, tracked like the app header.
    function _drawWordmark(ctx, x, baseline, size, centre) {
      const track = -size * 0.04;
      ctx.font = '800 ' + size + 'px Syne, sans-serif';
      ctx.textAlign = 'left';
      const letters = [...'TODAY'];
      const width = letters.reduce((w, ch) => w + ctx.measureText(ch).width + track, 0) - track;
      let cx = centre ? x - width / 2 : x;
      letters.forEach((ch, i) => {
        ctx.fillStyle = i < 2 ? IMG.text : IMG.accent;
        ctx.fillText(ch, cx, baseline);
        cx += ctx.measureText(ch).width + track;
      });
    }

    let _sharingInProgress = false;
    async function _shareAsImage() {
      if (!poem || _sharingInProgress) return;
      _sharingInProgress = true;
      // fonts.ready only covers faces the page already used; load the image's faces explicitly.
      await Promise.all([
        document.fonts.load('400 32px "DM Mono"'),
        document.fonts.load('800 40px Syne'),
      ]).catch(() => {});

      const { W, H, M } = IMG;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = IMG.bg;
      ctx.fillRect(0, 0, W, H);

      const { size, rows } = _layoutPoem(ctx, poem.text, W - M * 2);
      const centred = rows.length <= 3;
      const lead = Math.round(size * (centred ? 1.6 : 1.55)), contLead = Math.round(size * 1.35);
      const step = (r, i) => (i === 0 ? 0 : r.gap ? lead * 1.8 : r.cont ? contLead : lead);
      const AUTHOR_GAP = 64;
      const height = size * 0.72 + rows.reduce((h, r, i) => h + step(r, i), 0) + AUTHOR_GAP;
      // Optically centred, kept inside the 1080×1080 centre crop.
      const top = Math.min(Math.max(Math.round((H - height) / 2) - 35, 200), 1190 - height);
      const x = centred ? W / 2 : M;
      ctx.textAlign = centred ? 'center' : 'left';

      _drawStar(ctx, centred ? W / 2 : M + 11, top - 46, 22);

      let y = top + Math.round(size * 0.72);
      ctx.font = '400 ' + size + 'px ' + MONO;
      ctx.fillStyle = IMG.text;
      rows.forEach((r, i) => {
        y += step(r, i);
        if (r.text) ctx.fillText(r.text, x + (!centred && r.cont ? r.indent : 0), y);
      });
      ctx.font = '400 26px ' + MONO;
      ctx.fillStyle = IMG.muted;
      ctx.fillText('— ' + poem.author, x, y + AUTHOR_GAP);

      // Signature follows the layout: centred under a centred poem, split under a left one.
      if (centred) {
        _drawWordmark(ctx, W / 2, H - 118, 36, true);
        ctx.font = '400 20px ' + MONO;
        ctx.fillStyle = IMG.muted;
        ctx.textAlign = 'center';
        ctx.fillText(fmtDate(dateParam) + '  ·  today-here.netlify.app', W / 2, H - 72);
      } else {
        _drawWordmark(ctx, M, H - 108, 40, false);
        ctx.font = '400 22px ' + MONO;
        ctx.fillStyle = IMG.muted;
        ctx.textAlign = 'right';
        ctx.fillText(fmtDate(dateParam), W - M, H - 140);
        ctx.fillText('today-here.netlify.app', W - M, H - 108);
      }

      canvas.toBlob(async blob => {
        const file = new File([blob], 'poem.png', { type: 'image/png' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: poem.author + ' · TODAY' });
            document.getElementById('shareStatus').textContent = 'Share sheet closed.';
          } else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'poem.png';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            document.getElementById('shareStatus').textContent = 'Poem image downloaded.';
          }
        } catch (e) {
          if (e.name !== 'AbortError') {
            console.warn('[poem] share failed', e);
            document.getElementById('shareStatus').textContent = 'Could not share the poem image.';
          }
        } finally {
          _sharingInProgress = false;
        }
      }, 'image/png');
    }
  </script>
  <script>
    (function() {
      const el = document.querySelector('.cta-link');
      if (!el) return;
      el.addEventListener('mouseenter', function() {
        if (this.classList.contains('_shimmer')) return;
        this.classList.add('_shimmer');
        this.addEventListener('animationend', () => this.classList.remove('_shimmer'), { once: true });
      });
    })();
  </script>
</body>
</html>
