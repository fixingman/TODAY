"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bash scripts/dev.sh setup"
archive = "bash scripts/dev.sh archive"
run_mode = "concurrent"

[scripts.run.dev]
available_in = ["local"]
command = "python3 -m http.server ${CONDUCTOR_PORT:-8000}"
default = true
icon = "play"
