[build]
  publish = "."
  # video/ is dev-only tooling (HyperFrames projects, capture script) — never serve it.
  command = "rm -rf video && node netlify/prepare-security-headers.mjs"
  functions = "netlify/functions"
  # Compare with this deployment context's last build, including validation-only promotions.
  # Empty/equal refs mean no usable cache baseline: build rather than skip.
  ignore = 'if [ -n "$CACHED_COMMIT_REF" ] && [ -n "$COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- index.html sw.js netlify.toml netlify/ docs/media/; then exit 0; else exit 1; fi'

[functions."*"]
  timeout = 26

[build.processing]
  skip_processing = false

# Security + cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The build adds a deployment-origin /assets/ script allowlist before Netlify reads headers.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.dropboxapi.com https://content.dropboxapi.com https://api.trello.com https://gmail.googleapis.com https://accounts.google.com https://www.googleapis.com/calendar/v3/; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[edge_functions]]
  path = "/poem.html"
  function = "poem"

# Production — master only
[context.production]
  command = "rm -rf video && node netlify/prepare-security-headers.mjs"

# dev branch — builds and deploys to https://dev--today-here.netlify.app/
[context.dev]
  command = "rm -rf video && node netlify/prepare-security-headers.mjs"
