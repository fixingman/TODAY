name: deployed performance

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
      PERF_TARGET_URL: https://dev--today-here.netlify.app/
      PERF_CPU_THROTTLE_RATE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix scripts
      - name: Verify Chrome
        run: test -x "$CHROME_PATH"
      - name: Measure deployed dev build
        run: npm run performance --prefix scripts -- --target "$PERF_TARGET_URL" --output performance-nightly.json --no-audit-check
      - name: Retain benchmark JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-nightly-${{ github.run_id }}
          path: performance-nightly.json
          if-no-files-found: warn
          retention-days: 30
