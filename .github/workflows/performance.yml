name: deployed performance

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PERF_TARGET_URL: https://dev--today-here.netlify.app/
      PERF_CPU_THROTTLE_RATE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix scripts
      - name: Install locked Chrome for Testing
        run: node scripts/install-ci-browser.mjs
      - name: Allow the test browser to use its sandbox
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile today-ci-chrome "%s" flags=(unconfined) { userns, }\n' "$CHROME_PATH" | sudo tee /etc/apparmor.d/today-ci-chrome > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/today-ci-chrome
      - name: Verify Chrome
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
      - name: Measure deployed dev build
        run: npm run performance --prefix scripts -- --target "$PERF_TARGET_URL" --output performance-nightly.json --no-audit-check --require-version-match --trace-on-failure .context/performance-diagnostics
      - name: Retain benchmark JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-nightly-${{ github.run_id }}
          path: |
            performance-nightly.json
            .context/performance-diagnostics/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
